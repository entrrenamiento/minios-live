name: Build MiniOS ISO (custom 10-dev-web)

# Alineado con el workflow OFICIAL de MiniOS (trixie-xfce-standard-amd64)
# + nuestro modulo personalizado (Geany, OpenCode, Falkon, toolchain C++).
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # El build de escritorio necesita ~15-20 GB; el runner trae ~14 GB, asi que liberamos.
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h

      # Sin submodulos: el build oficial de MiniOS tampoco los clona.
      - name: Checkout
        uses: actions/checkout@v4

      # Nuestro modulo el ULTIMO (90) para que se construya sobre todo lo demas.
      - name: Enlazar modulo 10-dev-web
        run: |
          chmod +x linux-live/scripts/10-dev-web/install
          ln -sfn ../../scripts/10-dev-web linux-live/environments/xfce/90-dev-web
          ls -l linux-live/environments/xfce/

      # Union de dependencias: workflow oficial + wiki.
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y sudo binutils debootstrap squashfs-tools \
            xz-utils lz4 zstd xorriso mtools rsync grub-common gettext \
            dosfstools curl gpg openssl sbsigntool

      # Comando IDENTICO al build oficial de MiniOS (trixie xfce standard amd64).
      - name: Compilar ISO
        run: |
          sudo -E ./minios-cmd -d trixie -a amd64 -de xfce -pv standard \
            -dkms -kl -ib dracut
          sudo mkdir -p build/output
          sudo mv build/iso/*.iso    build/output/ || true
          sudo mv build/iso/*.sha256 build/output/ || true
          sudo chown -R $USER:$USER build/output
          ls -la build/output/

      - name: Subir ISO como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: minios-custom-iso
          path: build/output/
          if-no-files-found: error
